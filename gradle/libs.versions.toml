[versions]
agp             = "9.1.1"
kotlin          = "2.2.10"
core-ktx        = "1.15.0"
activity-compose = "1.13.0"
compose-bom     = "2026.06.00"
xr-runtime   = "1.0.0-alpha15"
xr-compose   = "1.0.0-alpha15"
xr-glimmer   = "1.0.0-alpha14"
xr-projected = "1.0.0-alpha08"

[libraries]
core-ktx                   = { module = "androidx.core:core-ktx",                version.ref = "core-ktx" }
activity-compose           = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom                = { module = "androidx.compose:compose-bom",          version.ref = "compose-bom" }
compose-ui                 = { module = "androidx.compose.ui:ui" }
compose-material3          = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation         = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling         = { module = "androidx.compose.ui:ui-tooling" }
xr-runtime                 = { module = "androidx.xr.runtime:runtime",           version.ref = "xr-runtime" }
xr-compose                 = { module = "androidx.xr.compose:compose",           version.ref = "xr-compose" }
xr-glimmer                 = { module = "androidx.xr.glimmer:glimmer",           version.ref = "xr-glimmer" }
xr-projected               = { module = "androidx.xr.projected:projected",       version.ref = "xr-projected" }

[plugins]
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
